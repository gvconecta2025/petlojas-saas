<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PetLojas - Conectando Pet Shops</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .fade-enter { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div id="loader" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-100 mb-6 border-b-teal-600"></div>
        <p class="text-gray-400 font-black tracking-widest text-xs uppercase">Carregando Ecossistema...</p>
    </div>

    <div id="marketplace-root" class="hidden min-h-screen">
        <header class="bg-slate-900 text-white p-6 shadow-xl">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-3xl font-black">PetLojas <span class="text-teal-400">Hub</span></h1>
                <p class="text-slate-400 text-sm">Onde a gestão encontra os donos de pets.</p>
            </div>
        </header>
        <main class="max-w-4xl mx-auto p-6 space-y-10">
            <section>
                <h2 class="text-xl font-black text-gray-800 mb-4">Artigos em Destaque</h2>
                <div id="marketplace-articles" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
            <section>
                <h2 class="text-xl font-black text-gray-800 mb-4">Lojas Parceiras</h2>
                <div id="marketplace-stores" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <div id="store-root" class="hidden flex flex-col min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
            <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
                <button onclick="window.location.href='/'" class="flex items-center gap-3">
                    <img id="header-logo" src="https://placehold.co/100" class="w-12 h-12 rounded-xl object-cover">
                    <div>
                        <h1 id="header-store-name" class="font-black text-lg">Loja</h1>
                        <p class="text-[10px] text-gray-500">Atendemos toda a cidade.</p>
                    </div>
                </button>
                <button id="install-btn" onclick="window.installApp()" class="hidden bg-teal-700 text-white px-3 py-1 rounded-lg text-xs font-bold">Instalar</button>
            </div>
        </header>
        <main class="flex-grow max-w-3xl w-full mx-auto p-4 pb-20">
            <div id="feed-container" class="grid grid-cols-1 gap-4"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const lojaId = params.get('loja');

        if (!lojaId) {
            // MODO MARKETPLACE
            document.getElementById('marketplace-root').classList.remove('hidden');
            loadMarketplace();
        } else {
            // MODO LOJA (Whitelabel)
            document.getElementById('store-root').classList.remove('hidden');
            loadStore(lojaId);
        }

        async function loadMarketplace() {
            // Carregar Artigos
            onSnapshot(collection(db, 'revista_artigos'), (snap) => {
                const cont = document.getElementById('marketplace-articles');
                cont.innerHTML = snap.docs.map(d => `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-gray-800">${d.data().titulo}</h3>
                        <p class="text-xs text-gray-500">${d.data().resumo || ''}</p>
                    </div>`).join('');
            });
            // Carregar Lojas
            const stores = await getDocs(collection(db, 'stores'));
            const contStores = document.getElementById('marketplace-stores');
            contStores.innerHTML = stores.docs.map(d => `
                <div class="bg-teal-900 text-white p-4 rounded-xl flex justify-between items-center">
                    <span class="font-black">${d.id.toUpperCase()}</span>
                    <a href="?loja=${d.id}" class="bg-teal-500 px-3 py-1 rounded text-xs font-bold">Acessar</a>
                </div>`).join('');
            
            document.getElementById('loader').classList.add('hidden');
        }

        async function loadStore(id) {
            // (Logica de carregamento da loja existente que já tínhamos)
            onSnapshot(collection(db, 'stores', id, 'items'), (snap) => {
                const feed = document.getElementById('feed-container');
                feed.innerHTML = snap.docs.map(d => `
                    <div class="bg-white p-4 rounded-xl shadow border border-gray-100">
                        <h3 class="font-black">${d.data().title}</h3>
                        <p class="text-teal-700 font-bold">${d.data().price}</p>
                    </div>`).join('');
                document.getElementById('loader').classList.add('hidden');
            });
        }
    </script>
</body>
</html>
