<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER CORE - PetLojas SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="login-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-blue-600/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-3">
                <i data-lucide="cpu" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">PetLojas <span class="text-blue-500">Master</span></h1>
            <p class="text-slate-400 text-sm mb-8">Infraestrutura Central de Gestão</p>
            <button onclick="window.loginMaster()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all active:scale-95">
                <i data-lucide="shield-check"></i> ACEDER AO CORE
            </button>
        </div>
    </div>

    <div id="master-dashboard" class="hidden flex-col h-screen overflow-hidden">
        <header class="glass px-8 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="layers" class="w-5 h-5 text-white"></i></div>
                <h2 class="font-black text-xl tracking-tighter">MASTER <span class="text-blue-500">DASHBOARD</span></h2>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="window.forceUpdateMaster()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center gap-2 transition-all shadow-md active:scale-95">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> VERIFICAR ATUALIZAÇÕES
                </button>
                <div class="text-right hidden md:block">
                    <p id="admin-email" class="text-xs font-bold text-slate-400"></p>
                    <p class="text-[10px] text-emerald-400 font-black uppercase">Sistema Online</p>
                </div>
                <button onclick="window.logoutMaster()" class="bg-slate-800 p-2.5 rounded-xl hover:bg-red-500/20 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-grow overflow-y-auto p-8 space-y-8 max-w-7xl mx-auto w-full">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="glass p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1">Lojas Ativas</p>
                    <h3 id="stat-stores" class="text-4xl font-black text-white">0</h3>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1">Domínios Mapeados</p>
                    <h3 id="stat-domains" class="text-4xl font-black text-emerald-500">0</h3>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1">Total Produtos</p>
                    <h3 id="stat-items" class="text-4xl font-black text-blue-500">0</h3>
                </div>
                <div class="glass p-6 rounded-3xl border-blue-500/30 bg-blue-500/5">
                    <p class="text-blue-400 text-xs font-black uppercase tracking-widest mb-1">Status Sistema</p>
                    <h3 class="text-xl font-black text-white flex items-center gap-2">OPERACIONAL <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div></h3>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-1 space-y-6">
                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-500"></i> Nova Loja</h3>
                        <div class="space-y-4">
                            <input type="text" id="new-id" placeholder="ID da Loja (ex: amigopet)" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                            <input type="email" id="new-email" placeholder="E-mail do Lojista" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                            <input type="text" id="new-name" placeholder="Nome Comercial" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-blue-500">
                            <button onclick="window.createStore()" class="w-full bg-blue-600 py-3 rounded-2xl font-black text-sm shadow-lg shadow-blue-600/20 hover:bg-blue-500 transition-all">PROVISIONAR</button>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="globe" class="text-emerald-500"></i> Roteamento DNS</h3>
                        <div class="space-y-4">
                            <input type="text" id="dom-url" placeholder="dominio.com.br" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-emerald-500">
                            <input type="text" id="dom-target" placeholder="ID da Loja Alvo" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm outline-none focus:border-emerald-500">
                            <button onclick="window.mapDomain()" class="w-full bg-emerald-600 py-3 rounded-2xl font-black text-sm shadow-lg shadow-emerald-600/20 hover:bg-emerald-500 transition-all">CRIAR ROTA</button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-6">
                    <div class="glass p-6 rounded-3xl min-h-[500px]">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="font-black text-lg">Inquilinos na Infraestrutura</h3>
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500"></i>
                                <input type="text" id="searchStores" onkeyup="window.renderStores()" placeholder="Filtrar lojas..." class="bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-xs outline-none focus:border-blue-500">
                            </div>
                        </div>
                        <div id="stores-list" class="space-y-3"></div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // REMOVIDA A NECESSIDADE DE COLLECTIONGROUP E ADICIONADO O GETDOCS
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, getCountFromServer, query, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        const db = getFirestore(app);
        const MASTER_EMAIL = "professoragiselle.edu2@gmail.com";

        window.appStores = [];

        window.loginMaster = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { alert(e.message); } };
        window.logoutMaster = async () => { await signOut(auth); window.location.reload(); };

        window.forceUpdateMaster = async () => {
            if (confirm("Deseja forçar a atualização completa de cache e sincronizar os arquivos atuais do GitHub/Vercel?")) {
                localStorage.clear();
                sessionStorage.clear();
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }
                const cacheNames = await caches.keys();
                for (let cacheName of cacheNames) {
                    await caches.delete(cacheName);
                }
                alert("Cache destruído com sucesso! Recarregando aplicação limpa...");
                window.location.reload(true);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === MASTER_EMAIL) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('master-dashboard').classList.remove('hidden');
                document.getElementById('master-dashboard').classList.add('flex');
                document.getElementById('admin-email').innerText = user.email;
                lucide.createIcons();
                loadGlobalStats();
                loadStores();
                loadDomains();
            } else if (user) {
                alert("Acesso Negado."); signOut(auth);
            }
        });

        // NOVA LÓGICA DE CONTAGEM: 100% Automática e sem precisar de índices no Firebase
        async function loadGlobalStats() {
            try {
                // Conta Lojas
                const storesSnap = await getCountFromServer(collection(db, 'stores'));
                document.getElementById('stat-stores').innerText = storesSnap.data().count;

                // Conta Domínios
                const domainsSnap = await getCountFromServer(collection(db, 'domain_mapping'));
                document.getElementById('stat-domains').innerText = domainsSnap.data().count;

                // Conta Produtos (Varre cada loja ativamente)
                let totalItemsCount = 0;
                const storesList = await getDocs(collection(db, 'stores'));
                for (const store of storesList.docs) {
                    const itemsOfStore = await getCountFromServer(collection(db, 'stores', store.id, 'items'));
                    totalItemsCount += itemsOfStore.data().count;
                }
                document.getElementById('stat-items').innerText = totalItemsCount;

            } catch (err) {
                console.error("Erro na atualização de métricas: ", err);
            }
        }

        function loadStores() {
            onSnapshot(collection(db, 'stores'), (snap) => {
                window.appStores = [];
                snap.forEach(d => window.appStores.push({ id: d.id, ...d.data() }));
                renderStores();
                loadGlobalStats(); // Atualiza a contagem global sempre que houver alteração nas lojas
            });
        }

        window.renderStores = () => {
            const list = document.getElementById('stores-list');
            const q = document.getElementById('searchStores').value.toLowerCase();
            
            list.innerHTML = window.appStores.filter(s => s.id.includes(q) || s.ownerEmail.includes(q)).map(s => {
                const appUrl = `https://petlojas-saas.vercel.app/?loja=${s.id}`;
                const painelUrl = `https://petlojas-saas.vercel.app/painel/index.html?loja=${s.id}`;

                return `
                <div class="glass p-5 rounded-2xl flex flex-col gap-4 border border-slate-800 hover:border-blue-500/30 transition-all">
                    <div class="flex justify-between items-start gap-4">
                        <div class="flex items-center gap-4 flex-1">
                            <div class="w-12 h-12 bg-slate-950 rounded-xl flex items-center justify-center font-black text-blue-500 border border-slate-800 shrink-0">
                                ${s.id.substring(0,2).toUpperCase()}
                            </div>
                            <div class="min-w-0">
                                <p class="font-black text-white text-base truncate">${s.id}</p>
                                <p class="text-xs text-slate-500 font-mono truncate">${s.ownerEmail}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <div class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-[10px] font-black uppercase tracking-wider border border-emerald-500/10">Ativo</div>
                            <button onclick="window.deleteStore('${s.id}')" class="p-1.5 text-slate-500 hover:text-red-500 transition-colors rounded-lg hover:bg-red-500/10"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t border-slate-800/60">
                        <a href="${appUrl}" target="_blank" class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 hover:text-white hover:border-blue-500/40 transition-all font-semibold">
                            <i data-lucide="smartphone" class="w-4 h-4 text-blue-400 shrink-0"></i>
                            <span class="truncate">Ver App do Cliente</span>
                            <i data-lucide="external-link" class="w-3 h-3 ml-auto text-slate-600 shrink-0"></i>
                        </a>
                        <a href="${painelUrl}" target="_blank" class="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 hover:text-white hover:border-teal-500/40 transition-all font-semibold">
                            <i data-lucide="sliders" class="w-4 h-4 text-teal-400 shrink-0"></i>
                            <span class="truncate">Abrir Painel Lojista</span>
                            <i data-lucide="external-link" class="w-3 h-3 ml-auto text-slate-600 shrink-0"></i>
                        </a>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        function loadDomains() {
            onSnapshot(collection(db, 'domain_mapping'), (snap) => {
                loadGlobalStats();
            });
        }

        window.createStore = async () => {
            const id = document.getElementById('new-id').value.trim().toLowerCase();
            const email = document.getElementById('new-email').value.trim().toLowerCase();
            const name = document.getElementById('new-name').value.trim();
            if(!id || !email || !name) return alert("Dados incompletos.");
            try {
                await setDoc(doc(db, 'stores', id), { ownerEmail: email, createdAt: Date.now(), status: 'active' });
                await setDoc(doc(db, 'stores', id, 'settings', 'general'), { storeName: name, primaryColor: "#0f766e" });
                alert("Loja Provisionada!");
                document.getElementById('new-id').value = ''; document.getElementById('new-email').value = ''; document.getElementById('new-name').value = '';
            } catch(e) { alert(e.message); }
        };

        window.mapDomain = async () => {
            const url = document.getElementById('dom-url').value.trim().toLowerCase().replace(/^https?:\/\//, '');
            const target = document.getElementById('dom-target').value.trim().toLowerCase();
            if(!url || !target) return alert("Dados incompletos.");
            try {
                await setDoc(doc(db, 'domain_mapping', url.replace(/\./g, '_')), { domain: url, storeId: target });
                alert("Rota de Domínio Criada!");
                document.getElementById('dom-url').value = ''; document.getElementById('dom-target').value = '';
            } catch(e) { alert(e.message); }
        };

        window.deleteStore = async (id) => { if(confirm(`Apagar a loja ${id}?\nO cliente perderá acesso imediato.`)) await deleteDoc(doc(db, 'stores', id)); };
    </script>
</body>
</html>
