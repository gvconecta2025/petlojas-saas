<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">PetLojas - Carregando...</title>
    
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/icon.png">
    <link id="dynamic-apple-icon" rel="apple-touch-icon" href="/icon.png">
    <link id="dynamic-manifest" rel="manifest" href="/manifest.json" crossorigin="use-credentials">
    <meta id="dynamic-theme-color" name="theme-color" content="#0f766e">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Variáveis que o Firebase irá substituir dinamicamente */
            --cor-fundo: #f8fafc;
            --cor-primaria: #0f766e; 
            --cor-secundaria: #f59e0b; 
            --cor-texto: #334155;
            --cor-zap: #25D366;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-enter { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .pb-safe { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        .hidden { display: none !important; }
        
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        
        /* Classes auxiliares para Whitelabel */
        .text-primaria { color: var(--cor-primaria) !important; }
        .bg-primaria { background-color: var(--cor-primaria) !important; }
        .border-primaria { border-color: var(--cor-primaria) !important; }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW falhou.', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            if (btn) btn.classList.remove('hidden');
        });

        window.installApp = async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('install-btn').classList.add('hidden');
                }
                deferredPrompt = null;
            } else {
                if (window.showSystemMessage) {
                    window.showSystemMessage(
                        "Instalar o Aplicativo", 
                        "No iPhone (iOS): Toque no botão 'Partilhar' (quadrado com seta para cima) na barra do navegador e escolha 'Adicionar à Tela de Início'.\n\nNo Android: Procure por 'Instalar Aplicativo' no menu do navegador (3 pontinhos).", 
                        "info"
                    );
                } else {
                    alert("Para instalar: Use a opção 'Adicionar à Tela de Início' no menu do seu navegador.");
                }
            }
        };
    </script>
</head>
<body class="min-h-screen flex flex-col">

    <div id="loader" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <img id="splash-logo" src="" alt="Carregando Loja..." class="hidden w-40 h-40 sm:w-48 sm:h-48 object-contain mb-10 animate-pulse drop-shadow-2xl rounded-3xl" onerror="this.style.display='none'">
        
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-100 mb-6" style="border-bottom-color: var(--cor-primaria);"></div>
        <p class="text-gray-400 font-black tracking-widest text-xs animate-pulse uppercase">A CONECTAR À LOJA...</p>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="window.showView('home')" class="flex items-center gap-3 focus:outline-none select-none">
                <img id="header-logo" src="https://placehold.co/100x100?text=Logo" alt="Logótipo" class="w-14 h-14 object-contain transition-transform active:scale-95 shrink-0 drop-shadow-sm rounded-xl">
                <div class="text-left pointer-events-none">
                    <h1 id="header-store-name" class="text-xl font-black text-primaria leading-none truncate max-w-[150px] sm:max-w-[250px]">PetLojas</h1>
                    <p class="text-[9px] text-gray-500 font-medium leading-tight mt-0.5"><i data-lucide="map-pin" class="w-3 h-3 inline"></i> Atendemos toda a cidade.</p>
                </div>
            </button>
            
            <div class="flex items-center gap-2">
                <button id="install-btn" onclick="window.installApp()" class="hidden px-3 py-1.5 bg-primaria text-white text-[10px] sm:text-xs font-bold rounded-lg shadow-md active:scale-95 transition-all flex items-center gap-1 uppercase tracking-wider">
                    <i data-lucide="download" class="w-3 h-3 sm:w-4 sm:h-4"></i> Instalar
                </button>

                <button onclick="window.shareApp()" class="p-2 text-gray-500 hover:text-primaria bg-gray-50 rounded-full border border-gray-100 shadow-sm" title="Compartilhar">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
                <button onclick="window.showView('cart')" class="relative p-2 text-gray-500 hover:text-primaria bg-gray-50 rounded-full border border-gray-100 shadow-sm" title="Carrinho">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow-sm">0</span>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto px-4 pb-3 mt-1">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="window.handleSearch(event)" placeholder="Buscar por ração, banho, acessórios..." class="w-full bg-gray-100 border-none text-gray-700 text-sm rounded-2xl pl-10 pr-4 py-2.5 focus:ring-2 focus:ring-primaria outline-none transition-all">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto pb-safe">

        <div id="home-view" class="px-4 py-6 fade-enter">
            <div class="mb-6">
                <h2 class="text-2xl font-black text-gray-800">Vitrine</h2>
                <p class="text-sm text-gray-500 font-medium">Os melhores destaques para o seu Pet.</p>
            </div>
            <div id="feed-container" class="flex flex-col gap-6"></div>
        </div>

        <div id="catalog-view" class="px-4 py-6 fade-enter hidden">
            <div class="mb-6">
                <h2 id="catalog-title" class="text-2xl font-black text-gray-800 flex items-center gap-2">Catálogo</h2>
                <p id="catalog-subtitle" class="text-sm text-gray-500 font-medium">Tudo o que você precisa.</p>
            </div>
            <div id="quick-tags" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2"></div>
            <div id="catalog-container" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <div id="detail-view" class="px-4 py-6 fade-enter hidden">
            <button onclick="window.goBack()" class="flex items-center gap-2 text-primaria font-bold mb-4 hover:opacity-80 transition-opacity">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Voltar
            </button>
            <div id="detail-container" class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden"></div>
        </div>

        <div id="cart-view" class="px-4 py-6 fade-enter hidden">
            <h2 class="text-2xl font-black text-gray-800 mb-6">Seu Carrinho</h2>
            <div id="cart-items-container" class="flex flex-col gap-4 mb-6"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hidden" id="cart-summary">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-500 font-bold">Total do Pedido:</span>
                    <span id="cart-total" class="text-2xl font-black text-primaria">R$ 0,00</span>
                </div>
                <div class="flex flex-col gap-3">
                    <button onclick="window.checkoutWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#1ebd5a] text-white py-4 rounded-xl font-black text-lg uppercase tracking-wide shadow-[0_5px_15px_rgba(37,211,102,0.3)] transition-all flex items-center justify-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i> Fechar Pedido
                    </button>
                </div>
            </div>
            <div id="cart-empty" class="text-center py-12">
                <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-300">
                    <i data-lucide="shopping-cart" class="w-10 h-10"></i>
                </div>
                <p class="text-gray-500 font-medium">O carrinho está vazio.</p>
                <button onclick="window.showView('home')" class="mt-6 text-primaria font-bold bg-gray-100 px-6 py-2 rounded-xl">Voltar para a Vitrine</button>
            </div>
        </div>

        <div id="alerts-view" class="px-4 py-8 fade-enter hidden">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-[#dcf8c6] text-[#25D366] rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-md">
                    <i data-lucide="bell-ring" class="w-10 h-10"></i>
                </div>
                <h2 class="text-3xl font-black text-gray-800 mb-2">Clube VIP</h2>
                <p class="text-gray-600">Promoções relâmpago e avisos importantes.</p>
            </div>
            <div id="groups-container" class="flex flex-col gap-3"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-30">
        <div class="max-w-3xl mx-auto flex justify-around items-center h-[70px] pb-safe-offset">
            <button onclick="window.showView('home')" id="nav-home" class="nav-btn text-primaria flex flex-col items-center justify-center w-full h-full transition-colors">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mb-1 scale-110 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wide">Vitrine</span>
            </button>
            <button onclick="window.showView('catalog', 'product')" id="nav-product" class="nav-btn text-gray-400 hover:text-primaria flex flex-col items-center justify-center w-full h-full transition-colors">
                <i data-lucide="shopping-bag" class="w-6 h-6 mb-1 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wide">Produtos</span>
            </button>
            <button onclick="window.showView('catalog', 'service')" id="nav-service" class="nav-btn text-gray-400 hover:text-primaria flex flex-col items-center justify-center w-full h-full transition-colors">
                <i data-lucide="scissors" class="w-6 h-6 mb-1 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wide">Serviços</span>
            </button>
            <button onclick="window.showView('alerts')" id="nav-alerts" class="nav-btn text-gray-400 hover:text-[#25D366] flex flex-col items-center justify-center w-full h-full transition-colors">
                <i data-lucide="bell" class="w-6 h-6 mb-1 transition-transform"></i>
                <span class="text-[10px] font-bold tracking-wide text-center leading-tight mt-1">Avisos</span>
            </button>
        </div>
    </nav>

    <div id="msg-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center modal-overlay px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-300" id="msg-modal-box">
            <div id="msg-icon" class="mx-auto w-12 h-12 rounded-full mb-4 flex items-center justify-center"></div>
            <h3 id="msg-title" class="text-xl font-black text-gray-800 mb-2"></h3>
            <p id="msg-text" class="text-gray-600 text-sm mb-6 whitespace-pre-wrap"></p>
            <div id="msg-buttons"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CREDENCIAIS V2
        const firebaseConfig = {
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // FORÇAR PERSISTÊNCIA (SUPER COLA)
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        window.currentStoreId = null;
        window.appItems = [];
        window.appGroups = [];
        window.appSettings = { storeName: "Loja", whatsapp: "", mapsUrl: "", shareMessage: "" };
        window.cart = [];
        window.currentUser = null;

        let currentView = 'home';
        let currentCatalogType = 'product'; 
        let currentSearchQuery = '';
        let currentHistory = ['home'];

        // MOTOR DE RESOLUÇÃO DE TENANT (DINÂMICO)
        async function resolveTenant() {
            const urlParams = new URLSearchParams(window.location.search);
            const host = window.location.hostname;
            if (urlParams.has('loja')) return urlParams.get('loja');
            if (host !== 'localhost' && host !== '127.0.0.1' && !host.includes('vercel.app')) {
                try {
                    const domainDoc = await getDoc(doc(db, 'domain_mapping', host.replace(/\./g, '_')));
                    if (domainDoc.exists()) return domainDoc.data().storeId;
                } catch(e) {}
            }
            return 'demo_store';
        }

        window.onload = async () => {
            lucide.createIcons();
            window.currentStoreId = await resolveTenant();
            try { const cr = await signInAnonymously(auth); window.currentUser = cr.user; } catch(e) {}

            // CARREGAR SETTINGS
            onSnapshot(doc(db, 'stores', window.currentStoreId, 'settings', 'general'), (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    window.appSettings = { ...window.appSettings, ...data };
                    
                    document.getElementById('header-store-name').innerText = data.storeName || "PetLojas";
                    document.getElementById('page-title').innerText = data.storeName || "Loja";
                    
                    if(data.primaryColor) {
                        document.documentElement.style.setProperty('--cor-primaria', data.primaryColor);
                        document.getElementById('dynamic-theme-color').setAttribute("content", data.primaryColor);
                    }

                    // --- MÁGICA DO MANIFEST DINÂMICO PARA INSTALAÇÃO PWA ---
                    if(data.logoUrl) {
                        document.getElementById('header-logo').src = data.logoUrl;
                        
                        // Atualiza o logo gigante da splash screen e revela
                        const splash = document.getElementById('splash-logo');
                        splash.src = data.logoUrl;
                        splash.classList.remove('hidden');

                        // Atualiza favicons no navegador
                        document.getElementById('dynamic-favicon').href = data.logoUrl;
                        document.getElementById('dynamic-apple-icon').href = data.logoUrl;

                        // Recria o PWA App manifest no exato momento para o telemóvel assumir os dados deste cliente
                        const startUrl = window.location.search ? "/" + window.location.search : "/";
                        const dynamicManifest = {
                            name: data.storeName || "Loja",
                            short_name: data.storeName || "Loja",
                            start_url: startUrl,
                            display: "standalone",
                            background_color: "#f8fafc",
                            theme_color: data.primaryColor || "#0f766e",
                            icons: [
                                { src: data.logoUrl, sizes: "192x192", type: "image/png", purpose: "any maskable" },
                                { src: data.logoUrl, sizes: "512x512", type: "image/png", purpose: "any maskable" }
                            ]
                        };
                        const blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/json' });
                        document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);
                    }
                }
                
                // Remover Splash Screen elegantemente
                setTimeout(() => {
                    document.getElementById('loader').classList.add('opacity-0');
                    setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
                }, 800); // Aguarda um momento extra para a logomarca ser admirada
            });

            // CARREGAR ITEMS (Com Sanitização)
            onSnapshot(collection(db, 'stores', window.currentStoreId, 'items'), (snapshot) => {
                window.appItems = []; 
                snapshot.forEach(doc => {
                    let d = doc.data();
                    // Limpeza de erros "undefined"
                    if(d.description === 'undefined') d.description = '';
                    if(Array.isArray(d.tags)) d.tags = d.tags.filter(t => t && t !== 'undefined'); else d.tags = [];
                    window.appItems.push({ id: doc.id, ...d });
                });
                window.appItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if(currentView === 'home') renderFeed();
                if(currentView === 'catalog') renderCatalog();
                if(currentView === 'detail' && window.currentDetailId) openDetail(window.currentDetailId);
            });

            // CARREGAR GRUPOS
            onSnapshot(collection(db, 'stores', window.currentStoreId, 'groups'), (snapshot) => {
                window.appGroups = []; snapshot.forEach(doc => window.appGroups.push({ id: doc.id, ...doc.data() }));
                if(currentView === 'alerts') renderAlerts();
            });
        };

        // UTILITÁRIOS DE MÍDIA E FORMATAÇÃO
        window.getDriveImageUrl = (url) => { 
            if (!url) return ""; 
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/); 
            return match ? `https://drive.google.com/uc?export=view&id=${match[1]}` : url; 
        };
        window.getYoutubeId = (url) => { 
            if (!url) return null;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/); 
            return (match && match[2].length === 11) ? match[2] : null; 
        };
        window.parseCurrency = (str) => {
            if(!str) return 0;
            return parseFloat(String(str).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'));
        };
        window.formatCurrency = (num) => num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // NAVEGAÇÃO
        window.showView = (view, type = null) => {
            ['home-view', 'catalog-view', 'detail-view', 'alerts-view', 'cart-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if(view !== 'detail' && view !== 'cart') { document.getElementById('searchInput').value = ''; currentSearchQuery = ''; }

            if (view === 'home') { document.getElementById('home-view').classList.remove('hidden'); renderFeed(); currentHistory = ['home']; } 
            else if (view === 'catalog') {
                currentCatalogType = type;
                const titleObj = document.getElementById('catalog-title'); const subObj = document.getElementById('catalog-subtitle');
                if(type === 'product') { titleObj.innerHTML = `<i data-lucide="shopping-bag" class="w-6 h-6 text-primaria"></i> Produtos`; subObj.innerText = "Nossa vitrine de rações, brinquedos e acessórios."; } 
                else { titleObj.innerHTML = `<i data-lucide="scissors" class="w-6 h-6 text-primaria"></i> Serviços`; subObj.innerText = "Banho, tosa, veterinário e muito mais."; }
                document.getElementById('catalog-view').classList.remove('hidden'); renderCatalog(); currentHistory = ['catalog', type];
            }
            else if (view === 'alerts') { document.getElementById('alerts-view').classList.remove('hidden'); renderAlerts(); currentHistory = ['alerts']; }
            else if (view === 'cart') { document.getElementById('cart-view').classList.remove('hidden'); window.updateCartUI(); currentHistory = ['cart']; }
            
            updateActiveNav(view, type); window.scrollTo(0, 0); lucide.createIcons();
        };

        window.goBack = () => {
            if(currentHistory[0] === 'catalog') showView('catalog', currentHistory[1]); else showView('home'); 
        };

        function updateActiveNav(view, type) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-primaria'); btn.classList.add('text-gray-400');
                btn.querySelector('i')?.classList.remove('scale-110');
            });
            let id = 'nav-' + (type || view);
            let active = document.getElementById(id);
            if(active) { active.classList.remove('text-gray-400'); active.classList.add('text-primaria'); active.querySelector('i')?.classList.add('scale-110'); }
        }

        // BUSCA E FILTROS
        window.handleSearch = (e) => {
            currentSearchQuery = e.target.value.toLowerCase();
            if(currentSearchQuery.length > 0 && currentView !== 'catalog') showView('catalog', 'product');
            else renderCatalog();
        };

        window.filterByTag = (tag) => {
            document.getElementById('searchInput').value = tag;
            currentSearchQuery = tag.toLowerCase();
            renderCatalog();
        };

        const filterItems = (items) => {
            let filtered = items;
            if(currentSearchQuery) {
                filtered = items.filter(item => (item.title && item.title.toLowerCase().includes(currentSearchQuery)) || (item.tags && item.tags.some(t => t.toLowerCase().includes(currentSearchQuery))));
            }
            const now = Date.now();
            filtered = filtered.filter(item => {
                if (item.permanent) return true;
                if (item.expiresAt && item.expiresAt >= now) return true;
                return false; 
            });
            return filtered;
        };

        // RENDERERS
        window.renderFeed = () => {
            const container = document.getElementById('feed-container');
            const items = filterItems(window.appItems.filter(i => i.vitrine));
            if(items.length === 0) { container.innerHTML = `<p class="text-center py-10 text-gray-400">Sem destaques no momento.</p>`; return; }
            container.innerHTML = items.map(item => {
                const ytId = window.getYoutubeId(item.youtubeUrl);
                const images = item.images && item.images.length > 0 ? item.images : (item.image ? [item.image] : []);
                let mediaHtml = '';

                if (ytId) {
                    mediaHtml = `<div class="aspect-[9/16] bg-black relative overflow-hidden group"><iframe class="absolute inset-0 w-full h-full pointer-events-none transform scale-[1.05]" src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&loop=1&playlist=${ytId}&playsinline=1" frameborder="0" allow="autoplay; encrypted-media"></iframe><div class="absolute inset-0 z-10 flex items-center justify-center bg-black/10 group-hover:bg-black/20 transition-colors"><div class="w-16 h-16 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center border border-white/30 group-hover:bg-white/30 transition-all shadow-2xl group-hover:scale-110"><svg class="w-7 h-7 text-white ml-1 shadow-sm" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div></div>`;
                } else if (images.length > 1) {
                    const carouselId = `feed-carousel-${item.id}`;
                    const slides = images.map(img => `<img src="${window.getDriveImageUrl(img)}" class="w-full h-full object-cover flex-shrink-0 snap-center" onerror="this.onerror=null;this.src='https://placehold.co/600x600?text=Imagem'">`).join('');
                    mediaHtml = `
                    <div class="aspect-square bg-gray-100 relative overflow-hidden group">
                        <div id="${carouselId}" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth" onscroll="window.updateCarouselDots('${carouselId}')">${slides}</div>
                        <div class="absolute top-2 left-2 bg-black/50 text-white text-[10px] font-bold px-2 py-1 rounded-md backdrop-blur-sm z-10 pointer-events-none flex items-center gap-1"><i data-lucide="images" class="w-3 h-3"></i> ${images.length}</div>
                        <div id="dots-${carouselId}" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex gap-1.5 z-40 pointer-events-none">
                            ${images.map((_, i) => `<div class="w-2 h-2 rounded-full border border-black/20 transition-colors duration-300 shadow-md ${i === 0 ? 'bg-white' : 'bg-white/50'}"></div>`).join('')}
                        </div>
                    </div>`;
                } else {
                    const imgUrl = images.length === 1 ? window.getDriveImageUrl(images[0]) : 'https://placehold.co/600x600?text=Sem+Imagem';
                    mediaHtml = `<div class="aspect-square bg-gray-100 relative overflow-hidden"><img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" onerror="this.onerror=null;this.src='https://placehold.co/600x600?text=Sem+Imagem'"></div>`;
                }
                
                const tagsHtml = item.tags && item.tags.length > 0 ? `<div class="flex gap-2 mb-3 flex-wrap">${item.tags.map(tag => `<button onclick="event.stopPropagation(); window.filterByTag('${tag}'); window.showView('catalog', 'product')" class="text-[11px] bg-gray-100 border border-gray-200 text-gray-600 px-3 py-1 rounded-lg uppercase font-black tracking-wider shadow-sm cursor-pointer hover:bg-gray-200 transition-colors">${tag}</button>`).join('')}</div>` : '';

                return `
                <div onclick="window.openDetail('${item.id}')" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer relative group">
                    ${item.type === 'offer' ? `<div class="absolute top-4 right-4 bg-orange-500 text-white text-xs font-black px-4 py-1.5 rounded-full shadow-lg uppercase tracking-wider z-20">Oferta</div>` : ''}
                    ${mediaHtml}
                    <div class="p-5">
                        ${tagsHtml}
                        <h3 class="text-xl font-black text-gray-800 mb-1 leading-tight">${item.title || 'Sem título'}</h3>
                        <div class="flex items-end gap-2 mt-4"><span class="text-2xl font-black text-primaria">${item.price || 'R$ 0,00'}</span>${item.originalPrice ? `<span class="text-sm text-gray-400 line-through mb-1">${item.originalPrice}</span>` : ''}</div>
                        <div class="mt-4 pt-4 border-t border-gray-100"><button onclick="event.stopPropagation(); window.openDetail('${item.id}')" class="w-full bg-gray-50 text-primaria font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-gray-100 transition-colors">Ver Detalhes <i data-lucide="arrow-right" class="w-4 h-4"></i></button></div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        window.renderCatalog = () => {
            const container = document.getElementById('catalog-container');
            let items = filterItems(window.appItems.filter(item => currentSearchQuery ? (item.type === 'product' || item.type === 'service') : item.type === currentCatalogType));
            
            const tagsContainer = document.getElementById('quick-tags');
            let allTags = new Set();
            items.forEach(i => (i.tags||[]).forEach(t => allTags.add(t)));
            let tagsHtml = `<button onclick="window.filterByTag('')" class="px-4 py-1.5 ${currentSearchQuery === '' ? 'bg-primaria text-white' : 'bg-gray-200 text-gray-700'} text-xs font-bold rounded-full whitespace-nowrap shadow-sm transition-colors">Todos</button>`;
            Array.from(allTags).forEach(tag => {
                tagsHtml += `<button onclick="window.filterByTag('${tag}')" class="px-4 py-1.5 ${currentSearchQuery === tag.toLowerCase() ? 'bg-primaria text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'} text-xs font-bold rounded-full whitespace-nowrap shadow-sm transition-colors">${tag}</button>`;
            });
            tagsContainer.innerHTML = tagsHtml;

            if(items.length === 0) { container.innerHTML = `<div class="col-span-full py-10 text-center"><p class="text-gray-400">Nenhum item encontrado.</p></div>`; return; }

            container.innerHTML = items.map(item => {
                const imgUrl = item.images && item.images.length > 0 ? window.getDriveImageUrl(item.images[0]) : window.getDriveImageUrl(item.image);
                const isCarousel = item.images && item.images.length > 1;

                return `
                <div onclick="window.openDetail('${item.id}')" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer group flex flex-col h-full relative">
                    ${item.type === 'offer' ? `<div class="absolute top-2 right-2 bg-orange-500 text-white text-[9px] font-black px-2 py-0.5 rounded-md shadow uppercase tracking-wider z-10">Oferta</div>` : ''}
                    ${isCarousel ? `<div class="absolute top-2 left-2 bg-black/50 text-white text-[9px] font-bold px-1.5 py-0.5 rounded z-10 pointer-events-none flex items-center gap-1"><i data-lucide="images" class="w-3 h-3"></i></div>` : ''}
                    <div class="aspect-square bg-gray-100 relative overflow-hidden"><img src="${imgUrl || 'https://placehold.co/300x300?text=Sem+Foto'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" onerror="this.onerror=null;this.src='https://placehold.co/300x300?text=Sem+Foto'"></div>
                    <div class="p-3 flex flex-col flex-grow"><h3 class="text-sm font-bold text-gray-800 leading-tight mb-2 line-clamp-2">${item.title || 'Sem título'}</h3><div class="mt-auto"><p class="text-lg font-black text-primaria">${item.price || 'R$ 0,00'}</p></div></div>
                </div>`;
            }).join('');
            lucide.createIcons();
        };

        window.openDetail = (id) => {
            window.currentDetailId = id; 
            const item = window.appItems.find(x => x.id === id); if(!item) return;
            
            ['home-view', 'catalog-view', 'alerts-view', 'cart-view'].forEach(vid => document.getElementById(vid).classList.add('hidden')); 
            document.getElementById('detail-view').classList.remove('hidden'); currentView = 'detail'; window.scrollTo(0, 0);
            
            const container = document.getElementById('detail-container');
            const ytId = window.getYoutubeId(item.youtubeUrl);
            const images = item.images && item.images.length > 0 ? item.images : (item.image ? [item.image] : []);
            let mediaHtml = '';

            if (ytId) {
                mediaHtml = `<div class="aspect-[9/16] w-full relative bg-black"><iframe class="absolute inset-0 w-full h-full" src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=0&controls=1&modestbranding=1&rel=0&playsinline=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`;
            } else if (images.length > 1) {
                const carouselId = `detail-carousel-${item.id}`;
                const slides = images.map(img => `<img src="${window.getDriveImageUrl(img)}" class="w-full h-full object-cover flex-shrink-0 snap-center" onerror="this.onerror=null;this.src='https://placehold.co/600x600?text=Imagem'">`).join('');
                mediaHtml = `
                <div class="aspect-square w-full relative bg-gray-100 overflow-hidden">
                    <div id="${carouselId}" class="flex w-full h-full overflow-x-auto snap-x snap-mandatory no-scrollbar scroll-smooth" onscroll="window.updateCarouselDots('${carouselId}')">${slides}</div>
                    <div class="absolute top-3 right-3 bg-black/50 text-white text-xs font-bold px-3 py-1.5 rounded-lg backdrop-blur-sm z-10 pointer-events-none flex items-center gap-1"><i data-lucide="images" class="w-4 h-4"></i> ${images.length} fotos</div>
                    <div id="dots-${carouselId}" class="absolute bottom-5 left-1/2 transform -translate-x-1/2 flex gap-1.5 z-40 pointer-events-none">
                        ${images.map((_, i) => `<div class="w-2 h-2 rounded-full border border-black/20 transition-colors duration-300 shadow-md ${i === 0 ? 'bg-white' : 'bg-white/50'}"></div>`).join('')}
                    </div>
                </div>`;
            } else {
                const imgUrl = images.length === 1 ? window.getDriveImageUrl(images[0]) : 'https://placehold.co/600x600?text=Sem+Imagem';
                mediaHtml = `<div class="aspect-square w-full relative bg-gray-100"><img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x600?text=Sem+Imagem'"></div>`;
            }

            const tagsHtml = item.tags && item.tags.length > 0 ? `<div class="flex gap-2 mb-4 flex-wrap">${item.tags.map(tag => `<button onclick="window.filterByTag('${tag}'); window.showView('catalog', 'product')" class="text-xs bg-gray-100 border border-gray-200 text-gray-600 px-4 py-1.5 rounded-xl uppercase font-black tracking-widest shadow-sm cursor-pointer hover:bg-gray-200 transition-colors">${tag}</button>`).join('')}</div>` : '';
            const descHtml = item.description ? `<p class="text-gray-600 leading-relaxed mb-8 whitespace-pre-wrap">${item.description}</p>` : '';

            container.innerHTML = `
                <div class="relative">${mediaHtml}${item.type === 'offer' ? `<div class="absolute top-4 left-4 bg-orange-500 text-white text-xs font-black px-4 py-1.5 rounded-full shadow-lg uppercase tracking-wider z-10">Oferta</div>` : ''}</div>
                <div class="p-6">
                    ${tagsHtml}
                    <h1 class="text-2xl sm:text-3xl font-black text-gray-800 leading-tight mb-2">${item.title || 'Sem título'}</h1>
                    <div class="flex items-end gap-3 mb-6"><span class="text-3xl font-black text-primaria">${item.price || 'R$ 0,00'}</span>${item.originalPrice ? `<span class="text-lg text-gray-400 line-through mb-1">${item.originalPrice}</span>` : ''}</div>
                    ${descHtml}
                    <button onclick="window.addToCart('${item.id}')" class="w-full flex justify-center items-center gap-2 bg-primaria text-white py-4 px-6 rounded-2xl font-black text-base sm:text-lg uppercase tracking-wide shadow-md transition-all active:scale-95 mb-4"><i data-lucide="shopping-cart" class="w-6 h-6"></i> Adicionar ao Carrinho</button>
                </div>`;
            lucide.createIcons();
        };

        window.renderAlerts = () => {
            const container = document.getElementById('groups-container');
            if(window.appGroups.length === 0) { container.innerHTML = `<p class="text-center text-gray-400">Nenhum grupo disponível.</p>`; return; }
            container.innerHTML = window.appGroups.map(g => {
                if(g.status === 'full') return `<a href="#" onclick="return false;" class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-200 opacity-60"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i data-lucide="lock" class="w-5 h-5"></i></div><div><p class="font-bold text-gray-800">${g.name}</p><p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Lotação Máxima</p></div></div><button class="bg-gray-200 text-gray-500 px-4 py-2 rounded-lg text-sm font-bold cursor-not-allowed">Lotado</button></a>`;
                return `<a href="${g.link.startsWith('http') ? g.link : 'https://'+g.link}" target="_blank" class="flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-green-200 hover:border-green-500 transition-all group"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-[#dcf8c6] flex items-center justify-center text-[#25D366]"><i data-lucide="message-circle" class="w-5 h-5"></i></div><div><p class="font-bold text-gray-800">${g.name}</p><p class="text-[10px] text-[#25D366] font-bold uppercase tracking-widest">Vagas Abertas</p></div></div><button class="bg-[#25D366] text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-[#1ebd5a] transition-colors">Entrar</button></a>`;
            }).join('');
            lucide.createIcons();
        };

        // CARRINHO E CHECKOUT
        window.addToCart = (id) => {
            const item = window.appItems.find(x => x.id === id); if(!item) return;
            const existing = window.cart.find(x => x.id === id);
            if(existing) existing.quantity += 1; else window.cart.push({ ...item, quantity: 1 });
            window.updateCartUI();
            
            const modal = document.getElementById('msg-modal');
            const box = document.getElementById('msg-modal-box');
            document.getElementById('msg-title').innerText = "Adicionado";
            document.getElementById('msg-text').innerText = `${item.title} adicionado ao carrinho.`;
            document.getElementById('msg-icon').className = "mx-auto w-16 h-16 rounded-full mb-4 flex items-center justify-center bg-green-100 text-green-500";
            document.getElementById('msg-icon').innerHTML = '<i data-lucide="check-circle" class="w-8 h-8"></i>';
            document.getElementById('msg-buttons').innerHTML = `
                <button onclick="window.closeSystemMessage(); window.showView('cart')" class="w-full py-3 rounded-xl font-black text-sm text-white bg-primaria shadow-sm mb-2">Ver Carrinho</button>
                <button onclick="window.closeSystemMessage(); window.showView('catalog', 'product')" class="w-full py-3 rounded-xl font-bold text-sm text-gray-500 bg-gray-100 hover:bg-gray-200">Continuar Comprando</button>
            `;
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); box.classList.remove('scale-95'); }, 10);
            lucide.createIcons();
        };

        window.updateCartUI = () => {
            const totalItems = window.cart.reduce((sum, i) => sum + i.quantity, 0);
            const badge = document.getElementById('cart-badge');
            if(totalItems > 0) { badge.innerText = totalItems; badge.classList.remove('hidden'); } else badge.classList.add('hidden');

            const container = document.getElementById('cart-items-container');
            if(!container) return;
            if(window.cart.length === 0) {
                container.innerHTML = ''; document.getElementById('cart-summary').classList.add('hidden'); document.getElementById('cart-empty').classList.remove('hidden'); return;
            }

            document.getElementById('cart-empty').classList.add('hidden'); document.getElementById('cart-summary').classList.remove('hidden');
            let totalValue = 0;
            container.innerHTML = window.cart.map(item => {
                const sub = window.parseCurrency(item.price) * item.quantity; totalValue += sub;
                const imgUrl = item.images && item.images.length > 0 ? window.getDriveImageUrl(item.images[0]) : window.getDriveImageUrl(item.image);
                return `
                <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <img src="${imgUrl || 'https://placehold.co/100?text=Foto'}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-xl shrink-0" onerror="this.src='https://placehold.co/100?text=Foto'">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-gray-800 line-clamp-1 sm:line-clamp-2">${item.title}</p>
                        <p class="text-primaria font-black text-sm">${item.price}</p>
                    </div>
                    <div class="flex flex-col items-end gap-2 shrink-0">
                        <button onclick="window.removeFromCart('${item.id}')" class="text-red-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-200">
                            <button onclick="window.changeQuantity('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center rounded-md"><i data-lucide="minus" class="w-3 h-3"></i></button>
                            <span class="text-xs font-black w-4 text-center">${item.quantity}</span>
                            <button onclick="window.changeQuantity('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center rounded-md"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = window.formatCurrency(totalValue);
            lucide.createIcons();
        };

        window.changeQuantity = (id, delta) => { const item = window.cart.find(x => x.id === id); if(item) { item.quantity += delta; if(item.quantity <= 0) window.removeFromCart(id); else window.updateCartUI(); } };
        window.removeFromCart = (id) => { window.cart = window.cart.filter(x => x.id !== id); window.updateCartUI(); };

        window.checkoutWhatsApp = () => {
            if(window.cart.length === 0 || !window.appSettings.whatsapp) return;
            let text = "Olá! Acessei a loja digital e gostaria de fazer o pedido:%0A%0A";
            window.cart.forEach(item => {
                const sub = window.parseCurrency(item.price) * item.quantity;
                text += `🐾 ${item.quantity}x *${item.title}*%0A  Subtotal: ${window.formatCurrency(sub)}%0A%0A`;
            });
            const total = window.cart.reduce((sum, i) => sum + (window.parseCurrency(i.price) * i.quantity), 0);
            text += `*Total: ${window.formatCurrency(total)}*%0A%0AQual o procedimento?`;
            const waNum = window.appSettings.whatsapp.replace(/\D/g, ''); 
            window.open(`https://wa.me/${waNum}?text=${text}`, '_blank');
        };

        // UTILITÁRIOS 
        window.showSystemMessage = (title, text, type) => {
            const m = document.getElementById('msg-modal');
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-text').innerText = text;
            const icon = document.getElementById('msg-icon');
            icon.className = `mx-auto w-12 h-12 rounded-full mb-4 flex items-center justify-center ${type==='success'?'bg-green-100 text-green-600':(type==='error'?'bg-red-100 text-red-600':'bg-blue-100 text-blue-600')}`;
            icon.innerHTML = `<i data-lucide="${type==='success'?'check':(type==='error'?'alert-triangle':'info')}"></i>`;
            document.getElementById('msg-buttons').innerHTML = `<button onclick="window.closeSystemMessage()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Entendido</button>`;
            m.classList.remove('hidden'); setTimeout(() => m.classList.remove('opacity-0'), 10); lucide.createIcons();
        };

        window.closeSystemMessage = () => { document.getElementById('msg-modal').classList.add('opacity-0'); setTimeout(() => document.getElementById('msg-modal').classList.add('hidden'), 300); };
        
        window.shareApp = () => {
            const text = `🐾 *${window.appSettings.storeName || 'Loja'}*\n\n${window.appSettings.shareMessage || ''}\n\n📲 Acesse e instale o nosso App:\n👉 ${window.location.href}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        };
        
        window.openLocation = () => { if(window.appSettings.mapsUrl) window.open(window.appSettings.mapsUrl, '_blank'); };

    </script>
</body>
</html>
