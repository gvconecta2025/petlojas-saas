<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER CORE - PetLojas SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="login-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-blue-600/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-3">
                <i data-lucide="cpu" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">PetLojas <span class="text-blue-500">Master</span></h1>
            <p class="text-slate-400 text-sm mb-8">Infraestrutura Central de Gestão</p>
            <button onclick="window.loginMaster()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all active:scale-95">
                <i data-lucide="shield-check"></i> ACEDER AO CORE
            </button>
        </div>
    </div>

    <div id="master-dashboard" class="hidden flex-col h-screen overflow-hidden">
        <header class="glass px-8 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="layers" class="w-5 h-5 text-white"></i></div>
                <h2 class="font-black text-xl tracking-tighter">MASTER <span class="text-blue-500">DASHBOARD</span></h2>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="window.forceUpdateMaster()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 px-4 rounded-xl text-xs flex items-center gap-2 transition-all shadow-md active:scale-95">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> ATUALIZAR
                </button>
                <div class="text-right hidden md:block">
                    <p id="admin-email" class="text-xs font-bold text-slate-400"></p>
                    <p class="text-[10px] text-emerald-400 font-black uppercase">Sistema Online</p>
                </div>
                <button onclick="window.logoutMaster()" class="bg-slate-800 p-2.5 rounded-xl hover:bg-red-500/20 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-grow overflow-y-auto p-8 space-y-8 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs font-black uppercase mb-1">Lojas Ativas</p><h3 id="stat-stores" class="text-4xl font-black text-white">0</h3></div>
                <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs font-black uppercase mb-1">Domínios</p><h3 id="stat-domains" class="text-4xl font-black text-emerald-500">0</h3></div>
                <div class="glass p-6 rounded-3xl"><p class="text-slate-400 text-xs font-black uppercase mb-1">Total Produtos</p><h3 id="stat-items" class="text-4xl font-black text-blue-500">0</h3></div>
                <div class="glass p-6 rounded-3xl border-blue-500/30 bg-blue-500/5"><p class="text-blue-400 text-xs font-black uppercase mb-1">Status</p><h3 class="text-xl font-black text-white">OPERACIONAL</h3></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="layout-template" class="text-purple-500"></i> Marketplace Central</h3>
                        <input type="text" id="mkt-logo" placeholder="URL da Logo" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <input type="text" id="mkt-city" placeholder="Nome da Cidade (Abaixo do Logo)" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <button onclick="window.saveMarketplaceSettings()" class="w-full bg-purple-600 py-3 rounded-2xl font-black text-sm hover:bg-purple-500 transition-all">SALVAR CONFIGURAÇÕES</button>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="plus-circle" class="text-blue-500"></i> Nova Loja</h3>
                        <input type="text" id="new-id" placeholder="ID da Loja" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <input type="email" id="new-email" placeholder="E-mail" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <input type="text" id="new-name" placeholder="Nome Comercial" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <button onclick="window.createStore()" class="w-full bg-blue-600 py-3 rounded-2xl font-black text-sm hover:bg-blue-500 transition-all">PROVISIONAR</button>
                    </div>

                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="globe" class="text-emerald-500"></i> Roteamento DNS</h3>
                        <input type="text" id="dom-url" placeholder="dominio.com.br" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <input type="text" id="dom-target" placeholder="ID da Loja Alvo" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm mb-4">
                        <button onclick="window.mapDomain()" class="w-full bg-emerald-600 py-3 rounded-2xl font-black text-sm hover:bg-emerald-500 transition-all">CRIAR ROTA</button>
                    </div>
                </div>

                <div class="lg:col-span-2 glass p-6 rounded-3xl min-h-[500px]">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-black text-lg">Inquilinos na Infraestrutura</h3>
                        <input type="text" id="searchStores" onkeyup="window.renderStores()" placeholder="Filtrar lojas..." class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-xs outline-none focus:border-blue-500">
                    </div>
                    <div id="stores-list" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc, getCountFromServer, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);
        setPersistence(auth, browserLocalPersistence);

        const MASTER_EMAILS = ["professoragiselle.edu2@gmail.com", "gvconecta2025@gmail.com"];

        window.loginMaster = async () => { 
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            await signInWithPopup(auth, provider); 
        };

        window.logoutMaster = async () => { await signOut(auth); window.location.reload(); };

        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous && MASTER_EMAILS.includes(user.email)) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('master-dashboard').classList.remove('hidden');
                document.getElementById('master-dashboard').classList.add('flex');
                document.getElementById('admin-email').innerText = user.email;
                if(window.lucide) lucide.createIcons();
                loadAll();
            } else if (user) {
                // Caso não autorizado, força saída
                signOut(auth);
            }
        });

        window.copyToClipboard = (text) => { 
            navigator.clipboard.writeText(text); 
            alert("Link copiado!"); 
        };

        window.toggleStoreStatus = async (id, currentStatus) => {
            await updateDoc(doc(db, 'stores', id), { status: currentStatus === 'paused' ? 'active' : 'paused' });
        };

        window.saveMarketplaceSettings = async () => {
            const logoUrl = document.getElementById('mkt-logo').value;
            const cityName = document.getElementById('mkt-city').value;
            await setDoc(doc(db, 'system', 'marketplace'), { logoUrl, cityName }, { merge: true });
            alert("Configurações salvas!");
        };

        window.createStore = async () => {
            const id = document.getElementById('new-id').value.trim().toLowerCase();
            const email = document.getElementById('new-email').value.trim().toLowerCase();
            const name = document.getElementById('new-name').value.trim();
            if(!id || !email || !name) return alert("Dados incompletos.");
            await setDoc(doc(db, 'stores', id), { ownerEmail: email, createdAt: Date.now(), status: 'active' });
            await setDoc(doc(db, 'stores', id, 'settings', 'general'), { storeName: name, primaryColor: "#0f766e" });
            alert("Loja criada!");
        };

        window.mapDomain = async () => {
            const url = document.getElementById('dom-url').value.trim().toLowerCase().replace(/^https?:\/\//, '');
            const target = document.getElementById('dom-target').value.trim().toLowerCase();
            if(!url || !target) return alert("Dados incompletos.");
            await setDoc(doc(db, 'domain_mapping', url.replace(/\./g, '_')), { domain: url, storeId: target });
            alert("Rota criada!");
        };

        async function loadAll() {
            onSnapshot(doc(db, 'system', 'marketplace'), (d) => {
                if(d.exists()){
                    document.getElementById('mkt-logo').value = d.data().logoUrl || '';
                    document.getElementById('mkt-city').value = d.data().cityName || '';
                }
            });

            onSnapshot(collection(db, 'stores'), (snap) => {
                const list = document.getElementById('stores-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const s = d.data();
                    const status = s.status || 'active';
                    const appUrl = `https://petlojas-saas.vercel.app/?loja=${d.id}`;
                    const painelUrl = `https://petlojas-saas.vercel.app/painel/index.html?loja=${d.id}`;
                    list.innerHTML += `
                    <div class="glass p-4 rounded-xl flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="font-bold text-white">${d.id}</p>
                                <p class="text-[10px] ${status === 'active' ? 'text-emerald-500' : 'text-amber-500'} font-black uppercase">${status}</p>
                            </div>
                            <button onclick="window.deleteStore('${d.id}')" class="p-1 text-red-500 hover:bg-red-900/20 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                        <div class="flex flex-wrap gap-2 text-xs">
                            <button onclick="window.copyToClipboard('${appUrl}')" class="px-3 py-1.5 bg-slate-800 rounded-lg flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i> App</button>
                            <button onclick="window.copyToClipboard('${painelUrl}')" class="px-3 py-1.5 bg-slate-800 rounded-lg flex items-center gap-1"><i data-lucide="copy" class="w-3 h-3"></i> Painel</button>
                            <button onclick="window.toggleStoreStatus('${d.id}', '${status}')" class="px-3 py-1.5 ${status === 'paused' ? 'bg-emerald-600' : 'bg-amber-600'} rounded-lg font-bold">
                                ${status === 'paused' ? 'Ativar' : 'Pausar'}
                            </button>
                        </div>
                    </div>`;
                });
                lucide.createIcons();
            });
            
            const storesSnap = await getCountFromServer(collection(db, 'stores'));
            document.getElementById('stat-stores').innerText = storesSnap.data().count;
        }

        window.deleteStore = async (id) => { if(confirm(`Apagar a loja ${id}?`)) await deleteDoc(doc(db, 'stores', id)); };
        window.forceUpdateMaster = () => window.location.reload(true);
    </script>
</body>
</html>
