<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER CORE - PetLojas SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="login-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-blue-600/20 text-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-3">
                <i data-lucide="cpu" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black mb-2">PetLojas <span class="text-blue-500">Master</span></h1>
            <p class="text-slate-400 text-sm mb-8">Infraestrutura Central de Gestão</p>
            <button onclick="window.loginMaster()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all active:scale-95">
                <i data-lucide="shield-check"></i> ACEDER AO CORE
            </button>
        </div>
    </div>

    <div id="master-dashboard" class="hidden flex-col h-screen overflow-hidden">
        <header class="glass px-8 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-4">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="layers" class="w-5 h-5 text-white"></i></div>
                <h2 class="font-black text-xl tracking-tighter">MASTER <span class="text-blue-500">DASHBOARD</span></h2>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="window.logoutMaster()" class="bg-slate-800 p-2.5 rounded-xl hover:bg-red-500/20 hover:text-red-500 transition-all">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </header>

        <main class="flex-grow overflow-y-auto p-8 space-y-8 max-w-7xl mx-auto w-full">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-6">
                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-black text-lg mb-6 flex items-center gap-2"><i data-lucide="layout-template" class="text-purple-500"></i> Marketplace Central</h3>
                        <div class="space-y-4">
                            <input type="text" id="mkt-logo" placeholder="URL do Logo" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm">
                            <input type="text" id="mkt-city" placeholder="Nome da Cidade" class="w-full bg-slate-950 border border-slate-700 rounded-2xl px-4 py-3 text-sm">
                            <button onclick="window.saveMarketplaceSettings()" class="w-full bg-purple-600 py-3 rounded-2xl font-black text-sm">SALVAR CONFIGURAÇÕES</button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 glass p-6 rounded-3xl">
                    <h3 class="font-black text-lg mb-6">Lojas na Infraestrutura</h3>
                    <div id="stores-list" class="space-y-3"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const app = initializeApp({
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        });

        const auth = getAuth(app);
        const db = getFirestore(app);
        setPersistence(auth, browserLocalPersistence);

        window.loginMaster = async () => { await signInWithPopup(auth, new GoogleAuthProvider()); };
        window.logoutMaster = async () => { await signOut(auth); window.location.reload(); };

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "professoragiselle.edu2@gmail.com") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('master-dashboard').classList.remove('hidden');
                document.getElementById('master-dashboard').classList.add('flex');
                loadAll();
            }
        });

        window.copyToClipboard = (text) => {
            navigator.clipboard.writeText(text);
            alert("Link copiado!");
        };

        window.toggleStoreStatus = async (id, currentStatus) => {
            await updateDoc(doc(db, 'stores', id), { status: currentStatus === 'active' ? 'paused' : 'active' });
        };

        window.saveMarketplaceSettings = async () => {
            const logoUrl = document.getElementById('mkt-logo').value;
            const cityName = document.getElementById('mkt-city').value;
            await setDoc(doc(db, 'system', 'marketplace'), { logoUrl, cityName }, { merge: true });
            alert("Salvo!");
        };

        function loadAll() {
            onSnapshot(collection(db, 'stores'), (snap) => {
                const list = document.getElementById('stores-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const s = d.data();
                    const appUrl = `https://petlojas-saas.vercel.app/?loja=${d.id}`;
                    list.innerHTML += `
                    <div class="glass p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <p class="font-bold">${d.id}</p>
                            <p class="text-xs text-slate-400">${s.status || 'active'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="window.copyToClipboard('${appUrl}')" class="p-2 bg-slate-700 rounded-lg"><i data-lucide="copy" class="w-4 h-4"></i></button>
                            <button onclick="window.toggleStoreStatus('${d.id}', '${s.status}')" class="p-2 ${s.status === 'paused' ? 'bg-amber-600' : 'bg-emerald-600'} rounded-lg">
                                <i data-lucide="${s.status === 'paused' ? 'play' : 'pause'}" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>`;
                });
                lucide.createIcons();
            });
        }
    </script>
</body>
</html>
