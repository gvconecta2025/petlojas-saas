<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">PetLojas - Carregando...</title>
    
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f766e">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            /* Variáveis que o Firebase irá substituir dinamicamente */
            --cor-fundo: #f8fafc;
            --cor-primaria: #0f766e; 
            --cor-secundaria: #f59e0b; 
            --cor-texto: #334155;
            --cor-zap: #25D366;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .fade-enter { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .pb-safe { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        .hidden { display: none !important; }
        
        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); }
        
        /* Classes auxiliares para Whitelabel */
        .text-primaria { color: var(--cor-primaria) !important; }
        .bg-primaria { background-color: var(--cor-primaria) !important; }
        .border-primaria { border-color: var(--cor-primaria) !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="loader" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center transition-opacity duration-500">
        <img src="/icon.png" alt="PetLojas" class="w-24 h-24 object-contain mb-8 animate-pulse drop-shadow-md rounded-2xl" onerror="this.style.display='none'">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-gray-100 mb-4" style="border-bottom-color: var(--cor-primaria);"></div>
        <p class="text-gray-400 font-black tracking-widest text-xs animate-pulse uppercase">A iniciar loja...</p>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <button onclick="window.showView('home')" class="flex items-center gap-3 focus:outline-none select-none">
                <img id="header-logo" src="https://placehold.co/100x100?text=Logo" alt="Logótipo" class="w-14 h-14 object-contain transition-transform active:scale-95 shrink-0 drop-shadow-sm rounded-xl">
                <div class="text-left pointer-events-none">
                    <h1 id="header-store-name" class="text-xl font-black text-primaria leading-none">PetLojas</h1>
                    <p class="text-[9px] text-gray-500 font-medium leading-tight mt-0.5"><i data-lucide="map-pin" class="w-3 h-3 inline"></i> Atendimento Rápido</p>
                </div>
            </button>
            
            <div class="flex items-center gap-2">
                <button onclick="window.shareApp()" class="p-2 text-gray-500 hover:text-primaria bg-gray-50 rounded-full border border-gray-100 shadow-sm">
                    <i data-lucide="share-2" class="w-5 h-5"></i>
                </button>
                <button onclick="window.openLocation()" class="p-2 text-gray-500 hover:text-primaria bg-gray-50 rounded-full border border-gray-100 shadow-sm">
                    <i data-lucide="map-pin" class="w-5 h-5"></i>
                </button>
                <button onclick="window.showView('cart')" class="relative p-2 text-gray-500 hover:text-primaria bg-gray-50 rounded-full border border-gray-100 shadow-sm">
                    <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                    <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow-sm">0</span>
                </button>
            </div>
        </div>
        
        <div class="max-w-3xl mx-auto px-4 pb-3 mt-1">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                <input type="text" id="searchInput" onkeyup="window.handleSearch(event)" placeholder="Buscar na loja..." class="w-full bg-gray-100 border-none text-gray-700 text-sm rounded-2xl pl-10 pr-4 py-2.5 focus:ring-2 focus:ring-primaria outline-none transition-all">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto pb-safe">

        <div id="home-view" class="px-4 py-6 fade-enter">
            <div class="mb-6">
                <h2 class="text-2xl font-black text-gray-800">Vitrine</h2>
                <p class="text-sm text-gray-500 font-medium">Os melhores destaques para o seu Pet.</p>
            </div>
            <div id="feed-container" class="flex flex-col gap-6"></div>
        </div>

        <div id="catalog-view" class="px-4 py-6 fade-enter hidden">
            <div class="mb-6">
                <h2 id="catalog-title" class="text-2xl font-black text-gray-800 flex items-center gap-2">Catálogo</h2>
                <p id="catalog-subtitle" class="text-sm text-gray-500 font-medium">Tudo o que você precisa.</p>
            </div>
            <div id="quick-tags" class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pb-2"></div>
            <div id="catalog-container" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <div id="detail-view" class="px-4 py-6 fade-enter hidden">
            <button onclick="window.goBack()" class="flex items-center gap-2 text-primaria font-bold mb-4">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Voltar
            </button>
            <div id="detail-container" class="bg-white rounded-3xl shadow-lg border border-gray-100 overflow-hidden"></div>
        </div>

        <div id="cart-view" class="px-4 py-6 fade-enter hidden">
            <h2 class="text-2xl font-black text-gray-800 mb-6">Seu Carrinho</h2>
            <div id="cart-items-container" class="flex flex-col gap-4 mb-6"></div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hidden" id="cart-summary">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-gray-500 font-bold">Total:</span>
                    <span id="cart-total" class="text-2xl font-black text-primaria">R$ 0,00</span>
                </div>
                <button onclick="window.checkoutWhatsApp()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-black text-lg uppercase shadow-md flex items-center justify-center gap-2">
                    <i data-lucide="send" class="w-5 h-5"></i> Finalizar Pedido
                </button>
            </div>
            <div id="cart-empty" class="text-center py-12">
                <p class="text-gray-500 font-medium">O carrinho está vazio.</p>
                <button onclick="window.showView('home')" class="mt-4 text-primaria font-bold">Ver Vitrine</button>
            </div>
        </div>

        <div id="alerts-view" class="px-4 py-8 fade-enter hidden">
            <h2 class="text-3xl font-black text-gray-800 mb-6 text-center">Avisos e Ofertas</h2>
            <div id="groups-container" class="flex flex-col gap-3"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.03)] z-30">
        <div class="max-w-3xl mx-auto flex justify-around items-center h-[70px] pb-safe-offset">
            <button onclick="window.showView('home')" id="nav-home" class="nav-btn text-primaria flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="layout-dashboard" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Vitrine</span>
            </button>
            <button onclick="window.showView('catalog', 'product')" id="nav-product" class="nav-btn text-gray-400 flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="shopping-bag" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Produtos</span>
            </button>
            <button onclick="window.showView('catalog', 'service')" id="nav-service" class="nav-btn text-gray-400 flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="scissors" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Serviços</span>
            </button>
            <button onclick="window.showView('alerts')" id="nav-alerts" class="nav-btn text-gray-400 flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="bell" class="w-6 h-6 mb-1"></i><span class="text-[10px] font-bold">Avisos</span>
            </button>
        </div>
    </nav>

    <div id="msg-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center modal-overlay px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-300" id="msg-modal-box">
            <div id="msg-icon" class="mx-auto w-12 h-12 rounded-full mb-4 flex items-center justify-center"></div>
            <h3 id="msg-title" class="text-xl font-black text-gray-800 mb-2"></h3>
            <p id="msg-text" class="text-gray-600 text-sm mb-6 whitespace-pre-wrap"></p>
            <div id="msg-buttons"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // FORÇAR PERSISTÊNCIA (SUPER COLA)
        setPersistence(auth, browserLocalPersistence).catch(console.error);

        window.currentStoreId = null;
        window.appItems = [];
        window.appGroups = [];
        window.appSettings = { storeName: "Loja", whatsapp: "", mapsUrl: "" };
        window.cart = [];

        let currentView = 'home';
        let currentCatalogType = 'product'; 
        let currentSearchQuery = '';
        let currentHistory = ['home'];

        // MOTOR DE RESOLUÇÃO DE TENANT (DINÂMICO)
        async function resolveTenant() {
            const urlParams = new URLSearchParams(window.location.search);
            const host = window.location.hostname;
            if (urlParams.has('loja')) return urlParams.get('loja');
            if (host !== 'localhost' && host !== '127.0.0.1' && !host.includes('vercel.app')) {
                try {
                    const domainDoc = await getDoc(doc(db, 'domain_mapping', host.replace(/\./g, '_')));
                    if (domainDoc.exists()) return domainDoc.data().storeId;
                } catch(e) {}
            }
            return 'demo_store';
        }

        window.onload = async () => {
            lucide.createIcons();
            window.currentStoreId = await resolveTenant();
            try { await signInAnonymously(auth); } catch(e) {}

            // CARREGAR SETTINGS
            onSnapshot(doc(db, 'stores', window.currentStoreId, 'settings', 'general'), (docSnap) => {
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    window.appSettings = { ...window.appSettings, ...data };
                    document.getElementById('header-store-name').innerText = data.storeName || "PetLojas";
                    document.getElementById('page-title').innerText = data.storeName || "Loja";
                    if(data.logoUrl) document.getElementById('header-logo').src = data.logoUrl;
                    if(data.primaryColor) {
                        document.documentElement.style.setProperty('--cor-primaria', data.primaryColor);
                        document.querySelector('meta[name="theme-color"]').setAttribute("content", data.primaryColor);
                    }
                }
                // Remover Splash Screen
                document.getElementById('loader').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loader').classList.add('hidden'), 500);
            });

            // CARREGAR ITEMS (Com Sanitização)
            onSnapshot(collection(db, 'stores', window.currentStoreId, 'items'), (snapshot) => {
                window.appItems = []; 
                snapshot.forEach(doc => {
                    let d = doc.data();
                    // Limpeza de erros "undefined"
                    if(d.description === 'undefined') d.description = '';
                    if(Array.isArray(d.tags)) d.tags = d.tags.filter(t => t && t !== 'undefined'); else d.tags = [];
                    window.appItems.push({ id: doc.id, ...d });
                });
                window.appItems.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                if(currentView === 'home') renderFeed();
                if(currentView === 'catalog') renderCatalog();
                if(currentView === 'detail' && window.currentDetailId) openDetail(window.currentDetailId);
            });

            // CARREGAR GRUPOS
            onSnapshot(collection(db, 'stores', window.currentStoreId, 'groups'), (snapshot) => {
                window.appGroups = []; snapshot.forEach(doc => window.appGroups.push({ id: doc.id, ...doc.data() }));
                if(currentView === 'alerts') renderAlerts();
            });
        };

        // UTILITÁRIOS DE MÍDIA E FORMATAÇÃO
        window.getDriveImageUrl = (url) => { 
            if (!url) return ""; 
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/); 
            return match ? `https://drive.google.com/uc?export=view&id=${match[1]}` : url; 
        };
        window.getYoutubeId = (url) => { 
            if (!url) return null;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/); 
            return (match && match[2].length === 11) ? match[2] : null; 
        };
        window.parseCurrency = (str) => {
            if(!str) return 0;
            return parseFloat(String(str).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'));
        };
        window.formatCurrency = (num) => num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // NAVEGAÇÃO
        window.showView = (view, type = null) => {
            ['home-view', 'catalog-view', 'detail-view', 'alerts-view', 'cart-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            if(view !== 'detail' && view !== 'cart') { document.getElementById('searchInput').value = ''; currentSearchQuery = ''; }

            if (view === 'home') { document.getElementById('home-view').classList.remove('hidden'); renderFeed(); currentHistory = ['home']; } 
            else if (view === 'catalog') {
                currentCatalogType = type;
                document.getElementById('catalog-view').classList.remove('hidden'); renderCatalog(); currentHistory = ['catalog', type];
            }
            else if (view === 'alerts') { document.getElementById('alerts-view').classList.remove('hidden'); renderAlerts(); currentHistory = ['alerts']; }
            else if (view === 'cart') { document.getElementById('cart-view').classList.remove('hidden'); window.updateCartUI(); currentHistory = ['cart']; }
            
            updateActiveNav(view, type); window.scrollTo(0, 0); lucide.createIcons();
        };

        window.goBack = () => {
            if(currentHistory[0] === 'catalog') showView('catalog', currentHistory[1]); else showView('home'); 
        };

        function updateActiveNav(view, type) {
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-primaria'); btn.classList.add('text-gray-400');
                btn.querySelector('i')?.classList.remove('scale-110');
            });
            let id = 'nav-' + (type || view);
            let active = document.getElementById(id);
            if(active) { active.classList.remove('text-gray-400'); active.classList.add('text-primaria'); active.querySelector('i')?.classList.add('scale-110'); }
        }

        // BUSCA E FILTROS
        window.handleSearch = (e) => {
            currentSearchQuery = e.target.value.toLowerCase();
            if(currentSearchQuery.length > 0 && currentView !== 'catalog') showView('catalog', 'product');
            else renderCatalog();
        };

        window.filterByTag = (tag) => {
            document.getElementById('searchInput').value = tag;
            currentSearchQuery = tag.toLowerCase();
            renderCatalog();
        };

        // RENDERERS
        window.renderFeed = () => {
            const container = document.getElementById('feed-container');
            const items = window.appItems.filter(i => i.vitrine);
            if(items.length === 0) { container.innerHTML = `<p class="text-center py-10 text-gray-400">Sem destaques.</p>`; return; }
            container.innerHTML = items.map(item => `
                <div onclick="window.openDetail('${item.id}')" class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer group">
                    <div class="aspect-square bg-gray-50 relative overflow-hidden">
                        <img src="${window.getDriveImageUrl(item.image)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700">
                    </div>
                    <div class="p-5">
                        <h3 class="text-xl font-black text-gray-800 mb-1">${item.title}</h3>
                        <p class="text-2xl font-black text-primaria">${item.price}</p>
                        <button class="mt-4 w-full bg-gray-50 text-primaria font-bold py-3 rounded-xl">Ver Detalhes</button>
                    </div>
                </div>`).join('');
        };

        window.renderCatalog = () => {
            const container = document.getElementById('catalog-container');
            const filtered = window.appItems.filter(i => {
                const matchType = i.type === currentCatalogType;
                const matchSearch = !currentSearchQuery || i.title.toLowerCase().includes(currentSearchQuery) || (i.tags && i.tags.some(t => t.toLowerCase().includes(currentSearchQuery)));
                return matchType && matchSearch;
            });

            container.innerHTML = filtered.map(item => `
                <div onclick="window.openDetail('${item.id}')" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-3 flex flex-col h-full cursor-pointer">
                    <img src="${window.getDriveImageUrl(item.image)}" class="aspect-square object-cover rounded-xl mb-2">
                    <h3 class="text-sm font-bold text-gray-800 line-clamp-2 leading-tight">${item.title}</h3>
                    <p class="text-primaria font-black mt-auto pt-2">${item.price}</p>
                </div>`).join('') || '<p class="col-span-full text-center py-10 text-gray-400">Nenhum item.</p>';
        };

        window.openDetail = (id) => {
            window.currentDetailId = id;
            const item = window.appItems.find(x => x.id === id); if(!item) return;
            showView('detail');
            const container = document.getElementById('detail-container');
            container.innerHTML = `
                <img src="${window.getDriveImageUrl(item.image)}" class="w-full aspect-square object-cover">
                <div class="p-6">
                    <h1 class="text-2xl font-black text-gray-800 mb-2">${item.title}</h1>
                    <p class="text-3xl font-black text-primaria mb-6">${item.price}</p>
                    <p class="text-gray-600 mb-8 whitespace-pre-wrap">${item.description || ''}</p>
                    <button onclick="window.addToCart('${item.id}')" class="w-full bg-primaria text-white py-4 rounded-2xl font-black uppercase shadow-md">Adicionar ao Carrinho</button>
                </div>`;
        };

        window.renderAlerts = () => {
            const container = document.getElementById('groups-container');
            container.innerHTML = window.appGroups.map(g => `
                <a href="${g.link}" target="_blank" class="flex items-center justify-between bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i data-lucide="message-circle"></i></div>
                        <p class="font-bold text-gray-800">${g.name}</p>
                    </div>
                    <button class="bg-[#25D366] text-white px-4 py-2 rounded-lg text-sm font-bold">Entrar</button>
                </a>`).join('') || '<p class="text-center text-gray-400">Sem avisos.</p>';
            lucide.createIcons();
        };

        // CARRINHO E CHECKOUT
        window.addToCart = (id) => {
            const item = window.appItems.find(x => x.id === id); if(!item) return;
            const existing = window.cart.find(x => x.id === id);
            if(existing) existing.quantity += 1; else window.cart.push({ ...item, quantity: 1 });
            window.updateCartUI();
            window.showSystemMessage("Adicionado!", `${item.title} está no seu carrinho.`, "success");
        };

        window.updateCartUI = () => {
            const totalItems = window.cart.reduce((sum, i) => sum + i.quantity, 0);
            const badge = document.getElementById('cart-badge');
            if(totalItems > 0) { badge.innerText = totalItems; badge.classList.remove('hidden'); } else badge.classList.add('hidden');

            const container = document.getElementById('cart-items-container');
            if(window.cart.length === 0) { container.innerHTML = ''; document.getElementById('cart-summary').classList.add('hidden'); document.getElementById('cart-empty').classList.remove('hidden'); return; }

            document.getElementById('cart-empty').classList.add('hidden'); document.getElementById('cart-summary').classList.remove('hidden');
            let total = 0;
            container.innerHTML = window.cart.map(item => {
                const sub = window.parseCurrency(item.price) * item.quantity; total += sub;
                return `
                <div class="flex items-center gap-3 bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <img src="${window.getDriveImageUrl(item.image)}" class="w-16 h-16 object-cover rounded-xl">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-gray-800 line-clamp-1">${item.title}</p>
                        <p class="text-primaria font-black text-sm">${item.price}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-50 rounded-lg p-1 border border-gray-200">
                        <button onclick="window.changeQty('${item.id}', -1)" class="w-6 h-6"><i data-lucide="minus" class="w-3 h-3 mx-auto"></i></button>
                        <span class="text-xs font-black w-4 text-center">${item.quantity}</span>
                        <button onclick="window.changeQty('${item.id}', 1)" class="w-6 h-6"><i data-lucide="plus" class="w-3 h-3 mx-auto"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = window.formatCurrency(total);
            lucide.createIcons();
        };

        window.changeQty = (id, d) => { const i = window.cart.find(x => x.id === id); if(i) { i.quantity += d; if(i.quantity <= 0) window.cart = window.cart.filter(x => x.id !== id); window.updateCartUI(); } };

        window.checkoutWhatsApp = () => {
            let text = "Olá! Gostaria de fazer o seguinte pedido:%0A%0A";
            window.cart.forEach(i => text += `🐾 ${i.quantity}x ${i.title}%0A`);
            const total = document.getElementById('cart-total').innerText;
            text += `%0A*Total: ${total}*%0AQual o procedimento?`;
            window.open(`https://wa.me/${window.appSettings.whatsapp.replace(/\D/g, '')}?text=${text}`, '_blank');
        };

        // SISTEMA DE MENSAGENS
        window.showSystemMessage = (title, text, type) => {
            const m = document.getElementById('msg-modal');
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-text').innerText = text;
            const icon = document.getElementById('msg-icon');
            icon.className = `mx-auto w-12 h-12 rounded-full mb-4 flex items-center justify-center ${type==='success'?'bg-green-100 text-green-600':'bg-blue-100 text-blue-600'}`;
            icon.innerHTML = `<i data-lucide="${type==='success'?'check':'info'}"></i>`;
            document.getElementById('msg-buttons').innerHTML = `<button onclick="window.closeSystemMessage()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Entendido</button>`;
            m.classList.remove('hidden'); setTimeout(() => m.classList.remove('opacity-0'), 10); lucide.createIcons();
        };

        window.closeSystemMessage = () => { document.getElementById('msg-modal').classList.add('opacity-0'); setTimeout(() => document.getElementById('msg-modal').classList.add('hidden'), 300); };
        window.shareApp = () => { window.open(`https://wa.me/?text=Conheça a nossa loja: ${window.location.href}`, '_blank'); };
        window.openLocation = () => { if(window.appSettings.mapsUrl) window.open(window.appSettings.mapsUrl, '_blank'); };

    </script>
</body>
</html>
