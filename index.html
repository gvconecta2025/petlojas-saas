<div id="marketplace-root" class="hidden flex-col flex-grow relative">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-teal-600 rounded-xl flex items-center justify-center font-black text-white shadow shadow-teal-500/50 overflow-hidden" id="mkt-logo-container">PL</div>
                    <h1 class="text-2xl font-black tracking-tight flex flex-col leading-none">
                        PETLOJAS
                        <span class="text-teal-400 font-medium text-[11px] uppercase tracking-widest mt-0.5" id="mkt-city-name">Avenida Digital</span>
                    </h1>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="window.forceUpdate()" class="p-2 bg-slate-800 text-teal-400 rounded-lg border border-slate-700 hover:bg-slate-700 transition" title="Limpar Cache e Atualizar">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-5xl w-full mx-auto px-4 py-8 space-y-12">
            </main>

        <button id="mkt-install-btn" onclick="window.installMarketplaceApp()" class="hidden fixed bottom-6 right-6 z-50 bg-teal-600 text-white px-5 py-4 rounded-full shadow-[0_10px_25px_rgba(15,118,110,0.5)] flex items-center gap-3 hover:bg-teal-500 hover:scale-105 active:scale-95 transition-all">
            <i data-lucide="download" class="w-6 h-6 animate-bounce"></i>
            <span class="font-black tracking-wide text-sm">INSTALAR APP</span>
        </button>
    </div>
