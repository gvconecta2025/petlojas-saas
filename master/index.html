<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Admin - PetLojas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex flex-col font-sans">

    <div id="login-screen" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center border-t-4 border-blue-500">
            <div class="w-16 h-16 bg-blue-500/20 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-black text-white mb-2">Acesso Master</h1>
            <p class="text-sm text-slate-400 mb-8">Acesso restrito à administração da infraestrutura PetLojas.</p>
            <button onclick="window.loginMaster()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-colors">
                <i data-lucide="key" class="w-5 h-5"></i> Autenticar Sistemas
            </button>
        </div>
    </div>

    <div id="master-dashboard" class="hidden flex-col h-screen overflow-hidden">
        <header class="bg-slate-950 px-6 py-4 flex justify-between items-center shadow-md border-b border-slate-800 shrink-0">
            <div class="flex items-center gap-3 text-blue-500">
                <i data-lucide="cpu" class="w-6 h-6"></i>
                <h2 class="font-black text-lg text-white tracking-widest">PETLOJAS <span class="text-blue-500">CORE</span></h2>
            </div>
            <button onclick="window.logoutMaster()" class="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-lg"><i data-lucide="power" class="w-5 h-5"></i></button>
        </header>

        <div class="flex-grow overflow-y-auto p-6 max-w-5xl mx-auto w-full space-y-8">
            
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="font-black text-white mb-6 flex items-center gap-2 text-lg"><i data-lucide="store" class="text-blue-500 w-5 h-5"></i> Gestão de Lojistas (Tenants)</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">ID da Loja (Sem espaços)</label>
                        <input type="text" id="new-store-id" placeholder="ex: petshop_rex" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">E-mail do Proprietário</label>
                        <input type="email" id="new-store-email" placeholder="cliente@gmail.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Nome Comercial</label>
                        <input type="text" id="new-store-name" placeholder="Pet Shop Rex" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-blue-500 outline-none">
                    </div>
                </div>
                <button onclick="window.createStore()" class="bg-blue-600 hover:bg-blue-700 text-white py-3 px-6 rounded-xl font-bold text-sm shadow-md transition-colors flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Provisionar Nova Loja
                </button>

                <div class="mt-8">
                    <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Lojas Provisionadas na Infraestrutura</h4>
                    <div id="stores-list" class="space-y-3">
                        </div>
                </div>
            </div>

            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="font-black text-white mb-6 flex items-center gap-2 text-lg"><i data-lucide="globe" class="text-emerald-500 w-5 h-5"></i> Roteamento de Domínios Próprios</h3>
                
                <div class="flex flex-col md:flex-row gap-4 mb-6">
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Domínio (Sem https://)</label>
                        <input type="text" id="new-domain-url" placeholder="ex: www.petshoprex.com.br" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-emerald-500 outline-none">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Apontar para ID da Loja</label>
                        <input type="text" id="new-domain-target" placeholder="ex: petshop_rex" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-emerald-500 outline-none">
                    </div>
                    <div class="flex items-end">
                        <button onclick="window.mapDomain()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-6 rounded-xl font-bold text-sm shadow-md transition-colors flex items-center gap-2">
                            <i data-lucide="link" class="w-4 h-4"></i> Criar Rota
                        </button>
                    </div>
                </div>

                <div class="mt-8">
                    <h4 class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4">Tabela de Roteamento Ativa</h4>
                    <div id="domains-list" class="space-y-3">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // CREDENCIAIS V2
        const firebaseConfig = {
            apiKey: "AIzaSyBcrhhlr6sPRy1wfhCBwyAucnTleQDWPUI",
            authDomain: "petlojas-saas.firebaseapp.com",
            projectId: "petlojas-saas",
            storageBucket: "petlojas-saas.firebasestorage.app",
            messagingSenderId: "699445164987",
            appId: "1:699445164987:web:908f92216c5fee00aea29e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const MASTER_EMAIL = "professoragiselle.edu2@gmail.com";

        window.loginMaster = async () => { 
            try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
            catch(e) { alert("Erro de Autenticação: " + e.message); } 
        };
        
        window.logoutMaster = async () => { 
            await signOut(auth); 
            window.location.reload(); 
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email !== MASTER_EMAIL) {
                    alert("Acesso Recusado: Nível de privilégio insuficiente.");
                    signOut(auth);
                    return;
                }
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('master-dashboard').classList.remove('hidden');
                document.getElementById('master-dashboard').classList.add('flex');
                lucide.createIcons();
                loadMasterData();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('master-dashboard').classList.add('hidden');
                document.getElementById('master-dashboard').classList.remove('flex');
            }
        });

        function loadMasterData() {
            // Monitorar Lojas
            onSnapshot(collection(db, 'stores'), (snap) => {
                const list = document.getElementById('stores-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
                            <div>
                                <p class="text-white font-bold text-sm mb-1">${d.id}</p>
                                <p class="text-blue-400 text-xs font-mono">${data.ownerEmail}</p>
                            </div>
                            <button onclick="window.deleteStore('${d.id}')" class="text-red-500 hover:text-red-400 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>`;
                });
                lucide.createIcons();
            });

            // Monitorar Domínios
            onSnapshot(collection(db, 'domain_mapping'), (snap) => {
                const list = document.getElementById('domains-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const data = d.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-700">
                            <div class="flex items-center gap-4">
                                <div class="bg-emerald-500/20 text-emerald-500 p-2 rounded-lg"><i data-lucide="globe" class="w-4 h-4"></i></div>
                                <div>
                                    <p class="text-white font-bold text-sm mb-1">${data.domain}</p>
                                    <p class="text-slate-400 text-xs flex items-center gap-1"><i data-lucide="arrow-right" class="w-3 h-3"></i> Roteia para: <span class="text-emerald-400 font-mono">${data.storeId}</span></p>
                                </div>
                            </div>
                            <button onclick="window.deleteDomain('${d.id}')" class="text-red-500 hover:text-red-400 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>`;
                });
                lucide.createIcons();
            });
        }

        // Funções de Escrita no Banco
        window.createStore = async () => {
            const id = document.getElementById('new-store-id').value.trim().toLowerCase();
            const email = document.getElementById('new-store-email').value.trim().toLowerCase();
            const name = document.getElementById('new-store-name').value.trim();

            if(!id || !email || !name) return alert("Preencha todos os campos.");
            if(/\s/.test(id)) return alert("O ID da loja não pode conter espaços.");

            try {
                // Cria o Documento Principal da Loja com o E-mail do Dono
                await setDoc(doc(db, 'stores', id), { ownerEmail: email, createdAt: Date.now() });
                // Cria as configurações iniciais com o Nome Comercial
                await setDoc(doc(db, 'stores', id, 'settings', 'general'), { storeName: name, primaryColor: "#0f766e" });
                
                document.getElementById('new-store-id').value = '';
                document.getElementById('new-store-email').value = '';
                document.getElementById('new-store-name').value = '';
                alert("Loja provisionada com sucesso!");
            } catch(e) { alert("Erro ao criar loja: " + e.message); }
        };

        window.mapDomain = async () => {
            let domain = document.getElementById('new-domain-url').value.trim().toLowerCase();
            const storeId = document.getElementById('new-domain-target').value.trim().toLowerCase();

            if(!domain || !storeId) return alert("Preencha domínio e ID da loja.");
            
            // Limpar http:// ou https:// se o utilizador digitar por engano
            domain = domain.replace(/^https?:\/\//, '');

            try {
                // O Firebase não aceita pontos no ID do documento facilmente em alguns contextos, usamos replace para segurança no ID, mas guardamos o domínio limpo no payload
                const docId = domain.replace(/\./g, '_');
                await setDoc(doc(db, 'domain_mapping', docId), { domain: domain, storeId: storeId, createdAt: Date.now() });
                
                document.getElementById('new-domain-url').value = '';
                document.getElementById('new-domain-target').value = '';
            } catch(e) { alert("Erro ao mapear domínio: " + e.message); }
        };

        window.deleteStore = async (id) => {
            if(confirm(`Tem a certeza absoluta que deseja apagar a raiz da loja ${id}?\nEsta ação destrói o acesso do dono.`)) {
                await deleteDoc(doc(db, 'stores', id));
            }
        };

        window.deleteDomain = async (id) => {
            if(confirm("Remover esta rota de domínio? O cliente deixará de conseguir aceder pelo domínio próprio.")) {
                await deleteDoc(doc(db, 'domain_mapping', id));
            }
        };

    </script>
</body>
</html>
